<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>MinePulse – Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="notification.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="notif-header">
      <a href="javascript:history.back()" class="back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>
      <h1>Notifications</h1>
      <button id="clear-all-btn" class="clear-btn">Clear All</button>
    </header>

    <!-- Notification List -->
    <div id="notifications-container">
      <div id="notifications-list">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>
  <script>
    // ============================================================
    // NOTIFICATION PAGE – Load and render from localStorage
    // ============================================================
    const listEl = document.getElementById('notifications-list');

    function renderNotifications() {
      let notifications = [];
      const stored = localStorage.getItem('minepulse_notifications');
      if (stored) {
        try { notifications = JSON.parse(stored); } catch(e) { notifications = []; }
      }
      if (notifications.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <p>No notifications yet.</p>
            <span>You'll see alerts here when something happens.</span>
          </div>
        `;
        return;
      }
      let html = '';
      notifications.slice(0, 50).forEach(notif => {
        const icon = notif.type === 'success' ? '✅' : (notif.type === 'warning' ? '⚠️' : '🔔');
        const time = new Date(notif.timestamp).toLocaleString();
        html += `
          <div class="notif-item ${notif.read ? 'read' : ''}">
            <div class="notif-icon">${icon}</div>
            <div class="notif-content">
              <div class="notif-title">${notif.title}</div>
              <div class="notif-body">${notif.body}</div>
              <span class="notif-time">${time}</span>
            </div>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    // Clear all notifications
    document.getElementById('clear-all-btn').addEventListener('click', function() {
      if (confirm('Clear all notifications?')) {
        localStorage.removeItem('minepulse_notifications');
        renderNotifications();
      }
    });

    // Render on load
    renderNotifications();
  </script>
</body>
</html>
